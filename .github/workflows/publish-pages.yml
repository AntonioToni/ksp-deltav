name: Publish consolidated Pages site

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages, Build pull request preview]
    types: [completed]
  # Metadata only: this workflow never checks out or executes the PR's code.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions: {}

# GitHub replaces pending runs. Every run reconciles ALL current builds and PRs.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AntonioToni/ksp-deltav' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: write
      id-token: write
    # Preserve the production environment's approval and branch restrictions.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted main workflow code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reconcile production and every active trusted preview
        id: reconcile
        uses: actions/github-script@v8
        env:
          PAGES_GIT_TOKEN: ${{ github.token }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const publisher = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pages-publish.mjs`).href);
            await publisher.reconcile({ github, context, core });
      - name: Configure Pages
        if: steps.reconcile.outputs.publish == 'true'
        uses: actions/configure-pages@v6
      - name: Upload consolidated site
        if: steps.reconcile.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.reconcile.outputs.site }}
      - name: Deploy production and previews together
        id: deployment
        if: steps.reconcile.outputs.publish == 'true'
        uses: actions/deploy-pages@v5
      - name: Update the single PR status comment
        if: always()
        uses: actions/github-script@v8
        env:
          PAGES_DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const publisher = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pages-publish.mjs`).href);
            await publisher.finish({ github, context, core }, process.env.PAGES_DEPLOYMENT_OUTCOME === 'success' ? 'success' : 'failure');
