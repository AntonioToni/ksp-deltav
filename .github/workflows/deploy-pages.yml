name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages-build
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'AntonioToni/ksp-deltav' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Allow dependency setup and the complete production browser suite to finish.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test routing and data
        run: npm test
      - name: Test deployment reconciliation and archive safety
        run: npm run test:deployment
      - name: Install browser for production checks
        run: npx playwright install --with-deps chromium
      - name: Build and test the Pages project path
        run: npm run test:pages -- --project=desktop
      - name: Package validated production build
        run: node .github/scripts/pages-build.mjs production
        env:
          PAGES_SOURCE_SHA: ${{ github.sha }}
      - name: Retain validated production snapshot
        uses: actions/upload-artifact@v6
        with:
          name: production-site-${{ github.sha }}-${{ github.run_attempt }}
          path: pages-build-artifact/
          retention-days: 90
          if-no-files-found: error
